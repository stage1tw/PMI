name: PMI weekly report

on:
  schedule:
    - cron: "0 22 * * 0"   # 매주 월요일 07:00 KST (일요일 22:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/weekly_job.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: Commit updated database
        run: |
          git config user.name "pmi-bot"
          git config user.email "pmi-bot@users.noreply.github.com"
          git add data/pmi.db
          git diff --cached --quiet || git commit -m "chore: weekly PMI report $(date +%F)"
          git push
